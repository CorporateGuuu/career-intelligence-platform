name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required portfolio files
        run: |
          test -f README.md
          test -f .env.example
          test -f docs/ARCHITECTURE.md
          test -f docs/ADR-001-event-ledger.md
          test -f SECURITY.md

      - name: Secret-pattern sanity check
        run: |
          if grep -RInE --exclude-dir=.git --exclude='.env.example' '(OPENAI_API_KEY|GOOGLE_CLIENT_SECRET|JWT_SECRET|SESSION_SECRET)=[^[:space:]]+' .; then
            echo "Potential committed secret-like value detected."
            exit 1
          fi

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run API tests
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm install

      - name: Build Next.js portfolio dashboard
        run: npm run build
